name: kokoro-real-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "studio/engine_assets.py"
      - "studio/engine_registry.py"
      - "studio/engine_manager.py"
      - "studio/runtime_manager.py"
      - "studio/model_manager.py"
      - "studio/ready_voices.py"
      - "studio/kokoro_adapter.py"
      - "studio/kokoro_worker.py"
      - "studio/synthesis.py"
      - "studio/protocol.py"
      - "scripts/smoke_kokoro.py"
      - ".github/workflows/kokoro-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "studio/engine_assets.py"
      - "studio/engine_registry.py"
      - "studio/engine_manager.py"
      - "studio/runtime_manager.py"
      - "studio/model_manager.py"
      - "studio/ready_voices.py"
      - "studio/kokoro_adapter.py"
      - "studio/kokoro_worker.py"
      - "studio/synthesis.py"
      - "studio/protocol.py"
      - "scripts/smoke_kokoro.py"
      - ".github/workflows/kokoro-smoke.yml"

concurrency:
  group: kokoro-real-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kokoro-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/huggingface-kokoro
      VOICE_STUDIO_UV: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lightweight host management dependencies
        run: python -m pip install --no-cache-dir -r requirements-dev.txt "huggingface-hub>=0.34,<1"
      - name: Run isolated Kokoro Speech Core smoke
        run: PYTHONPATH=. python scripts/smoke_kokoro.py --output-dir smoke-output/kokoro
      - name: Upload Kokoro smoke output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-kokoro
          path: |
            smoke-output/kokoro/kokoro-smoke.wav
            smoke-output/kokoro/kokoro-smoke.json
          if-no-files-found: ignore
          retention-days: 3
