name: ui-e2e

on:
  pull_request:
    paths:
      - "product_app.py"
      - "app.py"
      - "assets/**"
      - "studio/**"
      - "tests/test_ui_e2e.py"
      - "requirements*.txt"
      - ".github/workflows/ui-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "product_app.py"
      - "app.py"
      - "assets/**"
      - "studio/**"
      - "tests/test_ui_e2e.py"
      - "requirements*.txt"
      - ".github/workflows/ui-e2e.yml"

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    # Pin the runner image because this workflow deliberately uses its preinstalled
    # Google Chrome instead of downloading another browser and OS dependency bundle.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CREATOR_STUDIO_BASE_URL: http://127.0.0.1:7860
      CREATOR_STUDIO_BROWSER_CHANNEL: chrome
      GRADIO_ANALYTICS_ENABLED: "False"
      UI_ARTIFACT_DIR: ui-artifacts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install product shell and browser-test dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements-ui.txt -r requirements-dev.txt -r requirements-e2e.txt
      - name: Verify runner browser
        run: google-chrome --version
      - name: Import product shell without speech runtimes
        run: |
          python - <<'PY'
          import sys
          import product_app

          heavy = ("torch", "torchaudio", "chatterbox", "qwen_tts", "faster_whisper")
          leaked = [name for name in heavy if name in sys.modules]
          if leaked:
              raise SystemExit(f"Product shell imported heavy speech modules: {leaked}")
          print("Product shell import ok without speech runtimes")
          PY
      - name: Start product UI
        shell: bash
        run: |
          python product_app.py > /tmp/creator-studio-ui.log 2>&1 &
          echo $! > /tmp/creator-studio-ui.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:7860/ >/dev/null; then
              echo "Product UI is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/creator-studio-ui.log
          exit 1
      - name: Run browser product checks
        run: pytest -q tests/test_ui_e2e.py
      - name: Upload product screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-e2e-screenshots
          path: ui-artifacts/
          if-no-files-found: ignore
          retention-days: 5
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/creator-studio-ui.log || true
      - name: Stop product UI
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/creator-studio-ui.pid ]]; then
            kill "$(cat /tmp/creator-studio-ui.pid)" 2>/dev/null || true
          fi
