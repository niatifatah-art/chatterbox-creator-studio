name: real-model-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "studio/**"
      - "app.py"
      - "requirements.txt"
      - "requirements-optional.txt"
      - "scripts/smoke_models.py"
      - ".github/workflows/model-smoke.yml"
  push:
    branches:
      - main
      - dev/v1.1-product-experience
    paths:
      - "studio/**"
      - "app.py"
      - "requirements.txt"
      - "requirements-optional.txt"
      - "scripts/smoke_models.py"
      - ".github/workflows/model-smoke.yml"

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full application
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Import application
        run: python -c "import app; print('app import ok')"
      - name: Start local Gradio server and probe it
        shell: bash
        run: |
          python app.py > /tmp/creator-studio.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:7860/ >/tmp/studio.html; then
              test -s /tmp/studio.html
              echo "UI server responded successfully"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/creator-studio.log
          exit 1

  model-smoke:
    name: model-smoke (${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        model:
          - multilingual-v3
          - turbo
          - nano
    env:
      HF_HOME: /tmp/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Download official reference voice
        run: curl --fail --location --retry 3 --output /tmp/reference.wav https://storage.googleapis.com/chatterbox-demo-samples/prompts/female_random_podcast.wav
      - name: Run real model smoke test
        run: PYTHONPATH=. python scripts/smoke_models.py --model "${{ matrix.model }}" --voice /tmp/reference.wav --output-dir smoke-output
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.model }}
          path: smoke-output/${{ matrix.model }}/
          if-no-files-found: ignore
          retention-days: 3
